type      = "i64le"
type      = "u64le"
type      = "i128le"
type      = "u128le"
type      = "i16be"
type      = "u16be"
type      = "i32be"
type      = "u32be"
type      = "i64be"
type      = "u64be"
type      = "i128be"
type      = "u128be"
type      = "f16le"
type      = "f32le"
type      = "f64le"
type      = "f16be"
type      = "f32be"
type      = "f64be"

constant  = "true"

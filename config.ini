[editor]
enable_animations      = true
blur_strength          = 32
relative_line_numbers  = true
scroll_animation_speed = 7.5
cursor_animation_speed = 10
popup_animation_speed  = 7.5
tab_width              = 4
scroll_scale           = 5
padding                = 10

[colors]
white  = "#ABB2BF"
black  = "#1E2128"
blue   = "#62AEEF"
grey   = "#32363D"
green  = "#98C379"
red    = "#E06B74"
yellow = "#E5C07A"
purple = "#C778DD"

[theme]
ident               = "white"
gutter              = "white"
gutter.bg           = "#32363D80"
cursor.fg           = "black"
cursor.bg           = "#B5BCC9"
cursor_secondary.fg = "black"
cursor_secondary.bg = "#ABB2BFAA"
selection.bg        = "grey"
keyword             = "blue"
function            = "blue"
comment.fg          = "white"
comment.bg          = "grey"
string              = "green"
number              = "red"
directive           = "red"
constant            = "red"
operator            = "red"

error               = "red"
warning             = "yellow"
information         = "green"
hint                = "blue"

type                = "yellow"
background.bg       = "black"
popup_background    = "#1E212880"
popup_border        = "#32363D"
ui_focus            = "green"
ui_highlight        = "blue"
ui_text             = "white"

indicator_normal.bg = "blue"
indicator_normal.fg = "black"
indicator_visual.bg = "purple"
indicator_visual.fg = "black"
indicator_insert.bg = "green"
indicator_insert.fg = "black"

[leader.window]
h   = window-focus-left
j   = window-focus-below
k   = window-focus-above
l   = window-focus-right
S-h = window-move-left
S-j = window-move-below
S-k = window-move-above
S-l = window-move-right
t   = window-transpose

[leader.goto]
g = go-to-line
e = go-to-file-end
h = go-to-line-start
l = go-to-line-end
s = go-to-line-start-non-whitespace
d = go-to-definition

[leader.space]
f       = open-file
d       = diagnostics
k       = show-hover-information
a       = show-code-actions
y       = yank-system
p       = paste-system
S-p     = paste-system-before
b       = buffers
w       = leader.window
j       = jumplist
S-slash = command-palette

[leader.match-inside]
w               = match-in-word
S-w             = match-in-long-word
p               = match-in-paragraph
g               = match-in-change
S-9             = match-in-paren
S-0             = match-in-paren
S-left_bracket  = match-in-curly
S-right_bracket = match-in-curly
left_bracket    = match-in-bracket
right_bracket   = match-in-bracket
S-comma         = match-in-angled
S-period        = match-in-angled
S-apostrophe    = match-in-quote
apostrophe      = match-in-single-quote

[leader.match-around]
w               = match-around-word
p               = match-around-paragraph
S-9             = match-around-paren
S-0             = match-around-paren
S-left_bracket  = match-around-curly
S-right_bracket = match-around-curly
left_bracket    = match-around-bracket
right_bracket   = match-around-bracket
S-comma         = match-around-angled
S-period        = match-around-angled

[leader.match]
m = go-to-matching
i = leader.match-inside
a = leader.match-around
s = surround-add
d = surround-delete
r = surround-replace

[leader.case]
grave_accent = case-swap
l            = case-to-lower
u            = case-to-upper
c            = case-to-caml
p            = case-to-pascal
s            = case-to-snake
S-s          = case-to-screaming-snake

[keybinds.normal]
h            = character-left
j            = character-down
k            = character-up
l            = character-right
f            = find
S-f          = find-backward
v            = visual
w            = select-word-forward
e            = select-word-end-forward
b            = select-word-backward
S-w          = select-long-word-forward
S-e          = select-long-word-end-forward
S-b          = select-long-word-backward
r            = replace
d            = delete
i            = insert
a            = append
S-a          = go-to-line-end,character-right,insert
S-i          = go-to-line-start-non-whitespace,insert
o            = open-below
c            = change
S-o          = open-above
C-d          = view-half-page-down
C-u          = view-half-page-up
m            = leader.match
g            = leader.goto
space        = leader.space
S-comma      = outdent
S-7          = selections-align
S-period     = indent
slash        = search
n            = search-next
S-N          = search-previous
S-8          = set-search
S-semicolon  = command
comma        = keep-primary-selection
semicolon    = collapse-selection
S-c          = create-selection-below
grave_accent = leader.case
S-5          = select-all
x            = select-line
A-semicolon  = flip-selection
S-k          = keep-selections
s            = select
y            = yank
p            = paste
S-p          = paste-before
A-s          = split-lines
C-i          = jumplist-forward
C-o          = jumplist-backward

[keybinds.insert]
backspace = character-left,delete
delete    = delete
enter     = insert-newline
tab       = insert-tab

[language.odin]
extension = "odin"

keyword   = "import"
